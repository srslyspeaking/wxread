name: WeRead 2h + 2h + 1h daily

on:
  schedule:
    # Keep the starts away from the top of the hour, where scheduled runs are
    # more likely to be delayed. Times are local to Europe/Brussels.
    - cron: "17 10 * * *"
      timezone: "Europe/Brussels"
    - cron: "17 15 * * *"
      timezone: "Europe/Brussels"
    - cron: "17 23 * * *"
      timezone: "Europe/Brussels"
  workflow_dispatch:
    inputs:
      read_minutes:
        description: "本次目标阅读分钟数（1-120；留空则使用仓库变量 READ_MINUTES 或默认 60）"
        required: false
        type: string

# The workflow only needs to read its own repository contents.
permissions:
  contents: read

concurrency:
  group: weread-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        # actions/checkout v6; pinned to an immutable commit.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6; pinned to an immutable commit.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          --requirement requirements.txt

      - name: Resolve reading duration
        id: duration
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MINUTES: ${{ inputs.read_minutes }}
          DEFAULT_MINUTES: ${{ vars.READ_MINUTES || '60' }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            minutes="${MANUAL_MINUTES:-$DEFAULT_MINUTES}"
          else
            case "$SCHEDULE" in
              "17 10 * * *"|"17 15 * * *") minutes=120 ;;
              "17 23 * * *") minutes=60 ;;
              *)
                echo "Unsupported schedule: $SCHEDULE" >&2
                exit 1
                ;;
            esac
          fi
          printf 'minutes=%s\n' "$minutes" >> "$GITHUB_OUTPUT"

      - name: Run WeRead automation
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          READ_MINUTES: ${{ steps.duration.outputs.minutes }}
        run: python main.py
