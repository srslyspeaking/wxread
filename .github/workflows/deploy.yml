name: WeRead daily

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Brussels"
  workflow_dispatch:
    inputs:
      read_minutes:
        description: "本次目标阅读分钟数（留空则使用仓库变量 READ_MINUTES 或默认 68）"
        required: false
        type: string

# The workflow only needs to read its own repository contents.
permissions:
  contents: read

concurrency:
  group: weread-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        # actions/checkout v6; pinned to an immutable commit.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6; pinned to an immutable commit.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          --requirement requirements.txt

      - name: Run WeRead automation
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          READ_MINUTES: ${{ inputs.read_minutes || vars.READ_MINUTES || '68' }}
        run: python main.py
