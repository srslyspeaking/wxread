name: WeRead daily 2-3h

on:
  schedule:
    # Start earlier to allow for scheduler delays. Actual execution is guarded
    # below: start 09:00-19:00, stop by 22:00, all in Europe/Brussels.
    - cron: "17 10 * * *"
      timezone: "Europe/Brussels"
  workflow_dispatch:
    inputs:
      read_minutes:
        description: "本次目标阅读分钟数（1-180；留空则使用仓库变量 READ_MINUTES 或默认 60）"
        required: false
        type: string

# The workflow only needs to read its own repository contents.
permissions:
  contents: read

concurrency:
  group: weread-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 210

    steps:
      - name: Check daytime window
        id: window
        shell: bash
        run: |
          local_hour=$(TZ=Europe/Brussels date +%H)
          if (( 10#$local_hour >= 9 && 10#$local_hour < 19 )); then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped: outside the 09:00-19:00 start window (Europe/Brussels).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.window.outputs.allowed == 'true'
        # actions/checkout v6; pinned to an immutable commit.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.window.outputs.allowed == 'true'
        # actions/setup-python v6; pinned to an immutable commit.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        if: steps.window.outputs.allowed == 'true'
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          --requirement requirements.txt

      - name: Resolve daily reading plan
        if: steps.window.outputs.allowed == 'true'
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MINUTES: ${{ inputs.read_minutes }}
          DEFAULT_MINUTES: ${{ vars.READ_MINUTES || '60' }}
        run: |
          export LOCAL_DATE="$(TZ=Europe/Brussels date +%F)"
          python - <<'PY'
          import os
          from datetime import date

          from weekly_schedule import weekly_plan

          local_date = date.fromisoformat(os.environ["LOCAL_DATE"])
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              minutes = os.environ.get("MANUAL_MINUTES") or os.environ["DEFAULT_MINUTES"]
              summary = f"Manual target: {minutes} minutes"
          else:
              weekly_total, plan = weekly_plan(local_date)
              minutes = plan[local_date.weekday()]
              weekdays = ("Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun")
              formatted_plan = ", ".join(
                  f"{name} {value}m" for name, value in zip(weekdays, plan)
              )
              summary = (
                  f"ISO week total: {weekly_total} minutes; "
                  f"today: {minutes} minutes; plan: {formatted_plan}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"minutes={minutes}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(f"## Reading plan\n\n{summary}\n")
          print(summary)
          PY

      - name: Run WeRead automation
        if: steps.window.outputs.allowed == 'true'
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          READ_MINUTES: ${{ steps.plan.outputs.minutes }}
        shell: bash
        run: |
          # Recheck after setup/queue delays, immediately before reading.
          read -r local_hour local_date < <(TZ=Europe/Brussels date '+%H %F')
          if (( 10#$local_hour < 9 || 10#$local_hour >= 19 )); then
            echo 'Skipped: setup finished outside the 09:00-19:00 start window.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          deadline=$(TZ=Europe/Brussels date --date="$local_date 22:00:00" +%s)
          # Leave five seconds for process launch/termination; timeout 0 would
          # disable the limit, so fail closed if no time remains.
          seconds_left=$((deadline - $(date +%s) - 5))
          if (( seconds_left <= 0 )); then
            echo 'Skipped: the 22:00 local cutoff has been reached.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # KILL the entire timeout process group at the cutoff. Both automatic
          # and manual runs obey the same boundary; no overnight catch-up.
          if timeout --signal=KILL "${seconds_left}s" python main.py; then
            exit 0
          else
            result=$?
            echo "Reading stopped with exit code $result (22:00 cutoff enforced)." >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi

